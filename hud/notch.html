<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>JARVIS notch</title>
<style>
  :root { --c: #3ce8ff; --glow: rgba(60, 232, 255, .55); --lv: 0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; font: 13px/1.35 -apple-system, "SF Pro Text", sans-serif; color: #e8f6ff; user-select: none; }

  #wrap { position: absolute; top: 4px; right: 4px; transform-origin: top right;
          display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  body.center #wrap { top: 0; right: auto; left: 50%; transform-origin: top center; align-items: center; }

  #pill {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: #000; border: 1px solid rgba(60, 232, 255, .16); border-radius: 22px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
    transition: border-radius .3s, padding .3s;
  }
  body.center #pill { border-top: none; border-radius: 0 0 22px 22px; }
  #pill.open { align-items: flex-start; padding: 12px 16px; }

  /* ---------- les yeux ---------- */
  .face { position: relative; flex: none; width: 76px; height: 40px; cursor: pointer; }
  .eyes { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 14px;
          transition: transform .12s ease-out; }
  .eye {
    position: relative; width: 26px; height: 32px; border-radius: 11px; background: var(--c);
    box-shadow: 0 0 10px var(--glow), 0 0 22px var(--glow);
    transition: height .18s, width .18s, border-radius .18s, transform .18s, background .3s, clip-path .25s;
    overflow: hidden;
  }
  .eye::after { /* petit reflet */
    content: ""; position: absolute; top: 5px; left: 5px; width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255, 255, 255, .85); transition: opacity .2s;
  }
  .eye.blink { transform: scaleY(.08); }

  .tomoe { display: none; position: absolute; inset: 0; animation: spin 1.1s linear infinite; }
  .tomoe i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #000; left: calc(50% - 3px); top: 3px; }
  .tomoe i::after { content: ""; position: absolute; width: 4px; height: 6px; border-left: 2px solid #000; border-radius: 50%; left: 3px; top: 2px; }
  .tomoe i:nth-child(2) { transform: rotate(120deg); transform-origin: 3px 13px; }
  .tomoe i:nth-child(3) { transform: rotate(240deg); transform-origin: 3px 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .mouth { display: none; position: absolute; left: 50%; bottom: -3px; width: 18px; height: 9px; margin-left: -9px;
           background: var(--c); border-radius: 0 0 10px 10px; box-shadow: 0 0 8px var(--glow); }
  .zzz { display: none; position: absolute; right: -6px; top: -6px; font: 700 10px -apple-system; color: var(--c); }
  .zzz span { position: absolute; animation: zfloat 2.4s linear infinite; opacity: 0; }
  .zzz span:nth-child(2) { animation-delay: .8s; font-size: 8px; }
  .zzz span:nth-child(3) { animation-delay: 1.6s; font-size: 7px; }
  @keyframes zfloat { 0% { opacity: 0; transform: translate(0, 10px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -14px); } }
  .x { display: none; position: absolute; inset: 0; }
  .x::before, .x::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26px; height: 5px; margin: -2.5px 0 0 -13px;
                          background: var(--c); border-radius: 3px; box-shadow: 0 0 8px var(--glow); transform: rotate(45deg); }
  .x::after { transform: rotate(-45deg); }

  /* humeurs */
  body[data-mood="sleepy"] .eye { height: 4px; border-radius: 3px; }
  body[data-mood="sleepy"] .eye::after { opacity: 0; }
  body[data-mood="sleepy"] .zzz { display: block; }
  body[data-mood="surprise"] .eye { width: 30px; height: 30px; border-radius: 50%; transform: scale(1.12); }
  body[data-mood="excited"] .eye { height: 34px; animation: hop .5s ease-in-out infinite; }
  body[data-mood="excited"] .eye:nth-child(2) { animation-delay: .1s; }
  @keyframes hop { 50% { transform: translateY(-3px); } }
  body[data-mood="laugh"] .eye, body[data-mood="wink"] .eye.r {
    height: 16px; border-radius: 16px 16px 0 0; background: transparent; box-shadow: none;
    border: 5px solid var(--c); border-bottom: none; filter: drop-shadow(0 0 5px var(--glow));
  }
  body[data-mood="laugh"] .eye::after, body[data-mood="wink"] .eye.r::after { opacity: 0; }
  body[data-mood="laugh"] .mouth { display: block; }
  body[data-mood="laugh"] .eyes { animation: giggle .18s ease-in-out infinite; }
  @keyframes giggle { 50% { transform: translateY(-2px); } }
  body[data-mood="thinking"] .eye.l { clip-path: polygon(0 0, 100% 38%, 100% 100%, 0 100%); }
  body[data-mood="thinking"] .eye.r { clip-path: polygon(0 38%, 100% 0, 100% 100%, 0 100%); }
  body[data-mood="working"] .eye { width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle, #000 0 3px, #ff2a3c 4px 100%); box-shadow: 0 0 12px rgba(255, 42, 60, .7); }
  body[data-mood="working"] .eye::after { opacity: 0; }
  body[data-mood="working"] .tomoe { display: block; }
  body[data-mood="listening"] .eye { height: calc(18px + var(--lv) * 18px); width: calc(24px + var(--lv) * 6px); }
  body[data-mood="speaking"] .eye { animation: talk .32s ease-in-out infinite alternate; }
  @keyframes talk { to { height: 24px; } }
  body[data-mood="scared"] .eye { width: 12px; height: 14px; border-radius: 50%; animation: shiver .08s linear infinite; }
  @keyframes shiver { 50% { transform: translateX(1.5px); } }
  body[data-mood="error"] .eye { background: transparent; box-shadow: none; }
  body[data-mood="error"] .eye::after { opacity: 0; }
  body[data-mood="error"] .x { display: block; }
  body[data-mood="confused"] .eye.l { height: 20px; transform: rotate(-12deg); }
  body[data-mood="confused"] .eye.r { height: 32px; transform: rotate(8deg); }
  body[data-mood="boot"] .eye { opacity: .35; }

  /* couleurs */
  body[data-mood="listening"], body[data-mood="excited"] { --c: #4dffa6; --glow: rgba(77, 255, 166, .5); }
  body[data-mood="thinking"] { --c: #ffc94a; --glow: rgba(255, 201, 74, .5); }
  body[data-mood="error"], body[data-mood="scared"] { --c: #ff4d5e; --glow: rgba(255, 77, 94, .55); }
  body[data-mood="boot"] { --c: #6b7f88; --glow: transparent; }

  /* ---------- minuteur dans les yeux ---------- */
  .clock { display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
           font: 600 23px/1 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .02em; color: var(--c);
           text-shadow: 0 0 10px var(--glow); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .clock small { font-size: 14px; opacity: .8; }
  body.timer .face { width: auto; min-width: 76px; padding: 0 2px; }
  body.timer .eyes, body.timer .mouth, body.timer .zzz { visibility: hidden; }
  body.timer .clock { display: flex; position: static; height: 40px; }
  body.timer.hurry .clock { color: #ffd84a; text-shadow: 0 0 10px rgba(255, 216, 74, .6); }
  body.timer.paused .clock { animation: dim 1.2s steps(2) infinite; }
  @keyframes dim { 50% { opacity: .35; } }
  body.ringing #pill { animation: buzz .09s linear infinite; border-color: rgba(255, 77, 94, .7); }
  @keyframes buzz { 25% { transform: translate(-2px, 1px) rotate(-.6deg); } 75% { transform: translate(2px, -1px) rotate(.6deg); } }

  /* ---------- carte de tâches épinglée ---------- */
  #card {
    position: relative; width: 236px; padding: 10px 12px 8px; background: rgba(0, 0, 0, .92);
    border: 1px solid rgba(60, 232, 255, .16); border-radius: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
  }
  #card[hidden] { display: none; }
  .pin { position: absolute; top: -7px; left: 50%; margin-left: -6px; width: 12px; height: 16px; }
  #card h3 { display: flex; justify-content: space-between; font: 600 10px/1 -apple-system, sans-serif; letter-spacing: .16em;
             text-transform: uppercase; color: #3ce8ff; margin-bottom: 6px; }
  #card h3 span { color: #5d7480; letter-spacing: .05em; }
  #todos { list-style: none; padding: 0; max-height: 210px; overflow-y: auto; scrollbar-width: none; }
  #todos li { padding: 4px 0; border-top: 1px solid rgba(60, 232, 255, .07); cursor: pointer; }
  #todos li:first-child { border-top: none; }
  .row { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.3; }
  .box { flex: none; width: 13px; height: 13px; margin-top: 1px; border-radius: 50%; border: 1.5px solid rgba(60, 232, 255, .6); }
  li.done .box { background: #3ce8ff; border-color: #3ce8ff; box-shadow: inset 0 0 0 2px #000; }
  li.done .txt { color: #5d7480; text-decoration: line-through; }
  .acts { display: none; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px 21px; }
  li.sel .acts { display: flex; }
  .acts button { padding: 4px 6px; font-size: 9px; letter-spacing: .04em; white-space: nowrap; }
  .acts button.del { color: #ff6b78; border-color: rgba(255, 107, 120, .35); background: rgba(255, 77, 94, .06); }
  .tlabel { font-size: 10px; color: #8fa6b5; margin-top: 6px; display: flex; justify-content: space-between; }
  .tlabel:empty { display: none; }
  .tlabel button { padding: 3px 6px; font-size: 9px; }

  /* ---------- texte ---------- */
  #body { min-width: 0; width: 250px; display: none; }
  .open #body { display: block; }
  #st { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--c); }
  #you { margin-top: 3px; color: #8fa6b5; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  #me { margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #you:empty, #me:empty { display: none; }
  #btns { display: flex; gap: 6px; margin-top: 8px; }
  button {
    font: 600 10px/1 -apple-system, sans-serif; letter-spacing: .1em; color: var(--c); background: rgba(60, 232, 255, .08);
    border: 1px solid rgba(60, 232, 255, .3); border-radius: 8px; padding: 5px 9px; cursor: pointer;
  }
  button:hover { background: rgba(60, 232, 255, .2); }
  .hint { margin-top: 6px; font-size: 10px; color: #5d7480; }

  /* ---------- XP et notifications de quête ---------- */
  .xp { display: flex; align-items: center; gap: 8px; margin-top: 8px; font: 700 9.5px/1 -apple-system, sans-serif; letter-spacing: .12em; color: #9fd4ff; }
  .xp .bar { flex: 1; height: 4px; background: rgba(89, 180, 255, .15); border-radius: 2px; overflow: hidden; }
  .xp .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #59b4ff, #a87bff); box-shadow: 0 0 8px #59b4ff; transition: width .6s; }
  .xp small { color: #5d7480; letter-spacing: .04em; font-weight: 600; }
  #toast { display: none; min-width: 200px; padding: 10px 16px; text-align: center; background: linear-gradient(180deg, rgba(10, 22, 52, .97), rgba(4, 8, 22, .97));
           border: 1px solid rgba(89, 180, 255, .7); border-radius: 4px; box-shadow: 0 0 22px rgba(60, 130, 255, .55); }
  #toast.show { display: block; animation: popin .35s cubic-bezier(.2, 1.4, .4, 1), fadeout .5s 2.6s forwards; }
  #toast b { display: block; font: 800 15px/1.1 -apple-system, sans-serif; letter-spacing: .22em; color: #dff3ff; text-shadow: 0 0 10px #59b4ff, 0 0 22px #59b4ff; }
  #toast span { display: block; margin-top: 5px; font-size: 11px; color: #9fb8cc; }
  #toast.lvl { border-color: rgba(255, 210, 90, .8); box-shadow: 0 0 26px rgba(255, 190, 60, .55); }
  #toast.lvl b { font-size: 19px; color: #fff3c4; text-shadow: 0 0 10px #ffc23c, 0 0 26px #ff9d00; }
  @keyframes popin { from { transform: scale(.6); opacity: 0; } }
  @keyframes fadeout { to { opacity: 0; transform: translateY(-6px); } }

  /* =================== thème « Verre liquide » : vrai Liquid Glass d'Apple ===================
     Les plaques de verre sont des NSGlassEffectView natives placées derrière la page,
     calées en direct sur les éléments [data-glass] ; la page ne dessine que reflets et contours. */
  body.theme-glass { --c: #ffffff; --glow: rgba(255, 255, 255, .6); --spring: cubic-bezier(.34, 1.56, .64, 1); }
  body.theme-glass #wrap { gap: 8px; }
  body.theme-glass.center #wrap { top: 6px; }
  body.theme-glass #pill, body.theme-glass #card, body.theme-glass #toast {
    background: transparent; border: 1px solid rgba(255, 255, 255, .28); box-shadow: none; border-radius: 26px;
  }
  body.theme-glass.center #pill { border-radius: 26px; border-top: 1px solid rgba(255, 255, 255, .28); }
  body.theme-glass #card, body.theme-glass #toast { border-radius: 20px; }
  body.theme-glass #pill { padding: 9px 16px; }
  body.theme-glass .eyes { gap: 13px; }
  body.theme-glass .eye {
    background: radial-gradient(120% 90% at 50% 100%, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 60%);
    box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .85), inset 0 -1.5px 2px rgba(255, 255, 255, .3);
    border-radius: 13px; overflow: visible;
    transition: height .5s var(--spring), width .5s var(--spring), border-radius .45s var(--spring), transform .38s var(--spring), opacity .25s;
  }
  body.theme-glass .eye::after {   /* reflet spéculaire */
    top: 4px; left: 5px; width: 9px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0) 70%);
  }
  body.theme-glass .eye.blink { transform: scaleY(.1); transition-duration: .09s; }
  body.theme-glass .tomoe, body.theme-glass .x { display: none !important; }
  body.theme-glass .mouth { background: rgba(255, 255, 255, .9); box-shadow: 0 0 8px rgba(255, 255, 255, .6); }
  body.theme-glass[data-mood="laugh"] .eye, body.theme-glass[data-mood="wink"] .eye.r {
    border-color: rgba(255, 255, 255, .95); box-shadow: none; background: transparent; filter: drop-shadow(0 0 4px rgba(255, 255, 255, .7));
  }
  body.theme-glass[data-mood="thinking"] .eye { clip-path: none; height: 17px; }
  body.theme-glass[data-mood="working"] .eye { width: 30px; height: 30px; border-radius: 50%; background: transparent; }
  body.theme-glass[data-mood="working"] .eye::before {
    content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 2px solid transparent;
    border-top-color: rgba(255, 255, 255, .95); border-right-color: rgba(255, 255, 255, .35); animation: spin .8s linear infinite;
  }
  body.theme-glass[data-mood="error"] .eye { background: transparent; box-shadow: none; }
  body.theme-glass[data-mood="error"] .eye::after { opacity: 0; }
  body.theme-glass[data-mood="error"] .eye::before, body.theme-glass[data-mood="error"] .eye::after {
    content: ""; opacity: 1; position: absolute; left: 50%; top: 50%; width: 24px; height: 4px; margin: -2px 0 0 -12px;
    background: rgba(255, 255, 255, .95); border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 6px rgba(255, 90, 110, .8);
  }
  body.theme-glass[data-mood="error"] .eye::after { transform: rotate(-45deg); }
  /* teinte du verre des yeux selon l'humeur (lue par le script, appliquée au verre natif) */
  body.theme-glass[data-mood="listening"] { --tint: .25, .95, .75, .4; }
  body.theme-glass[data-mood="excited"] { --tint: .35, .85, 1, .35; }
  body.theme-glass[data-mood="thinking"] { --tint: 1, .75, .25, .4; }
  body.theme-glass[data-mood="working"] { --tint: .62, .4, 1, .45; }
  body.theme-glass[data-mood="speaking"] { --tint: .45, .75, 1, .28; }
  body.theme-glass[data-mood="scared"], body.theme-glass[data-mood="error"] { --tint: 1, .3, .4, .45; }
  body.theme-glass[data-mood="surprise"] { --tint: 1, 1, 1, .25; }
  body.theme-glass #st { color: #fff; opacity: .9; text-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  body.theme-glass #you { color: rgba(255, 255, 255, .7); text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
  body.theme-glass #me, body.theme-glass #todos, body.theme-glass #toast span { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
  body.theme-glass .hint, body.theme-glass .tlabel, body.theme-glass #card h3 span, body.theme-glass .xp small { color: rgba(255, 255, 255, .65); }
  body.theme-glass button { color: #fff; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .32); border-radius: 12px; }
  body.theme-glass button:hover { background: rgba(255, 255, 255, .26); }
  body.theme-glass .clock { color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
  body.theme-glass .pin { display: none; }
  body.theme-glass #card h3 { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  body.theme-glass .box { border-color: rgba(255, 255, 255, .75); }
  body.theme-glass li.done .box { background: #fff; border-color: #fff; box-shadow: inset 0 0 0 2.5px rgba(0, 0, 0, .25); }
  body.theme-glass li.done .txt { color: rgba(255, 255, 255, .5); }
  body.theme-glass #todos li { border-top-color: rgba(255, 255, 255, .14); }
  body.theme-glass .xp { color: #fff; }
  body.theme-glass .xp .bar { background: rgba(255, 255, 255, .2); }
  body.theme-glass .xp .bar i { background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, .8); }
  body.theme-glass #toast b { color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, .35); letter-spacing: .16em; }
  body.theme-glass #toast.lvl b { color: #fff; text-shadow: 0 0 12px rgba(255, 210, 120, .9); }
  body.theme-glass.ringing #pill { border-color: rgba(255, 120, 130, .8); }

  /* =================== thème « Ombre » : yeux manga, fenêtre Système =================== */
  .aeyes, .aura, .qicon { display: none; }
  body.theme-shadow { --c: #59b4ff; --c2: #4b2fe0; --glow: rgba(89, 160, 255, .7); }
  body.theme-shadow .eyes { display: none; }
  body.theme-shadow .face { width: 96px; }
  body.theme-shadow .aeyes { display: block; position: absolute; inset: 0; overflow: visible;
                             filter: drop-shadow(0 0 2.5px var(--glow)); transition: opacity .3s; }
  .aeyes .white { fill: #060c1c; }
  .aeyes .ring { fill: none; stroke: var(--c); stroke-width: .8; opacity: .55; }
  .aeyes .pupil { fill: #02040c; transform-box: fill-box; transform-origin: center; transition: transform .2s; }
  .aeyes .hl { fill: #fff; } .aeyes .hl2 { fill: #fff; opacity: .8; }
  .aeyes .star { fill: #fff; display: none; }
  .aeyes .gz { transition: transform .12s ease-out; }
  .aeyes .iris { transform-box: fill-box; transform-origin: center; transition: transform .2s; }
  .aeyes .lid { fill: #050a18; transition: transform .11s ease-in-out; }
  .aeyes .lash { fill: none; stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .aeyes .lower { fill: none; stroke: var(--c); stroke-width: 1; opacity: .45; stroke-linecap: round; }
  .aeyes .brow { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; opacity: .6;
                 transform-box: fill-box; transform-origin: right center; transition: transform .2s; }
  .aeyes .happy, .aeyes .spiral, .aeyes .blush, .aeyes .drop, .aeyes .shock, .aeyes .qmark { display: none; }
  .aeyes .happy { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; }
  .aeyes .spiral { fill: none; stroke: var(--c); stroke-width: 1.6; transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
  .aeyes .blush { stroke: #ff7ab6; stroke-width: 1.4; stroke-linecap: round; opacity: .9; }
  .aeyes .drop { fill: #8fd8ff; }
  .aeyes .shock { stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; }
  .aeyes .qmark { fill: var(--c); font: 800 12px -apple-system, sans-serif; }
  .aeyes.blink .lid { transform: translateY(29px); }

  /* aura d'ombre (mode ombre) */
  .aura { position: absolute; left: 0; right: 0; bottom: -4px; height: 52px; pointer-events: none; }
  .aura i { position: absolute; bottom: 0; width: 7px; height: 7px; border-radius: 50%; background: #9d5cff;
            filter: blur(1.5px); box-shadow: 0 0 10px #7a3cff; opacity: 0; animation: rise 1.6s ease-in infinite; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(1); } 25% { opacity: .9; } 100% { opacity: 0; transform: translateY(-46px) scale(.3); } }

  /* humeurs manga */
  body.theme-shadow[data-mood="sleepy"] .lid { transform: translateY(23px); }
  body.theme-shadow[data-mood="sleepy"] .brow { opacity: .3; }
  body.theme-shadow[data-mood="surprise"] .iris { transform: scale(.82); }
  body.theme-shadow[data-mood="surprise"] .pupil { transform: scale(.45); }
  body.theme-shadow[data-mood="surprise"] .shock { display: block; }
  body.theme-shadow[data-mood="surprise"] .brow { transform: translateY(-2px); opacity: .9; }
  body.theme-shadow[data-mood="excited"] .star, body.theme-shadow[data-mood="excited"] .blush { display: block; }
  body.theme-shadow[data-mood="excited"] .iris { transform: scale(1.06); }
  body.theme-shadow[data-mood="excited"] .hl { display: none; }
  body.theme-shadow[data-mood="laugh"] .open-eye { display: none; }
  body.theme-shadow[data-mood="laugh"] .happy, body.theme-shadow[data-mood="laugh"] .blush { display: block; }
  body.theme-shadow[data-mood="laugh"] .aeyes { animation: giggle .18s ease-in-out infinite; }
  body.theme-shadow[data-mood="wink"] .ae.r .open-eye { display: none; }

  /* fenêtre « Système » */
  body.theme-shadow #pill, body.theme-shadow #card {

<body data-mood="boot">
<div id="wrap">

      <line x1="6" y1="9" x2="6" y2="15.5" stroke="#9aa9b2" stroke-width="1.4" stroke-linecap="round"/>

<script>
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const SLEEP_AFTER = +(Q.get("sleep") || 60);
const LABELS = {
  pio: { boot: "Connexion…", idle: "En veille", listening: "Je t'écoute", transcribing: "Je décode…",
         thinking: "Je réfléchis…", working: "Je m'en occupe…", speaking: "Je te réponds" },
  shadow: { boot: "[Système] Connexion…", idle: "[Système] En veille", listening: "[Système] Écoute active",
            transcribing: "[Système] Analyse vocale", thinking: "[Système] Calcul en cours", working: "Mode Ombre activé",
            speaking: "[Système] Réponse" },
};
let theme = Q.get("theme") || "glass", LABEL = LABELS[theme] || LABELS.pio;

/* ---------- verre liquide : les plaques natives ne sont recalées que quand quelque chose bouge ----------
   (avant : 60 fois par seconde en permanence, ce qui saturait un cœur et gonflait la mémoire en 30 h) */
let glassLast = "", glassUntil = 0, glassRaf = 0, glassT = 0, tint = null;
const LIVE = new Set(["excited", "laugh", "scared", "speaking", "listening"]);   // humeurs qui animent les yeux en continu
function readTint() {
  const v = getComputedStyle(document.body).getPropertyValue("--tint").trim();
  tint = v ? v.split(",").map(Number) : null;
}
function glassPass(now) {
  glassRaf = 0;
  const mood = document.body.dataset.mood;
  const live = LIVE.has(mood) || document.body.classList.contains("ringing");
  if (live && now - glassT < 33) { glassRaf = requestAnimationFrame(glassPass); return; }   // 30 images/s au plus
  glassT = now;
  const spec = {};
  document.querySelectorAll("[data-glass]").forEach(el => {
    const name = el.dataset.glass, isEye = el.classList.contains("eye"), cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    // les yeux en arc (rire, clin d'œil) ou en croix ne sont plus des gouttes de verre
    const drawnOnly = isEye && (mood === "laugh" || mood === "error" || (mood === "wink" && el.classList.contains("r")));
    const visible = theme === "glass" && el.offsetParent !== null && cs.visibility !== "hidden"
      && !el.closest("[hidden]") && +cs.opacity > .05 && r.width > 1 && r.height > 1 && !drawnOnly;
    const k = r.width / (el.offsetWidth || r.width || 1);   // échelle effective (taille S…XL)
    spec[name] = visible
      ? { x: +r.left.toFixed(1), y: +r.top.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1),
          r: +(parseFloat(cs.borderTopLeftRadius) * k).toFixed(1), clear: isEye, tint: isEye ? tint : null }
      : { hidden: true, x: 0, y: 0, w: 0, h: 0 };
  });
  const str = JSON.stringify(spec);
  if (str !== glassLast) {
    glassLast = str;
    try { webkit.messageHandlers.glass.postMessage(spec); } catch (e) {}
  }
  if (live || now < glassUntil) glassRaf = requestAnimationFrame(glassPass);
}
function glassKick(ms = 900) {   // « quelque chose bouge » : on suit le verre pendant l'animation, puis on s'arrête
  glassUntil = Math.max(glassUntil, performance.now() + ms);
  if (!glassRaf) glassRaf = requestAnimationFrame(glassPass);
}
document.addEventListener("transitionrun", () => glassKick(900), true);
document.addEventListener("animationstart", () => glassKick(900), true);

/* ---------- yeux manga : un œil dessiné une fois, l'autre en miroir ---------- */
const EYE = `<g class="open-eye">
    <path class="white" d="M2 15 C 9 4 25 2 37 9 C 33 18 24 23 14 22 C 8 21 4 18 2 15 Z"/>
    <g clip-path="url(#almond)">
      <g class="gz"><g class="iris">
        <circle class="ring" cx="20" cy="13" r="9.6"/>
        <circle cx="20" cy="13" r="9" fill="url(#irisGrad)"/>
        <ellipse class="pupil" cx="20" cy="13" rx="3" ry="4.6"/>
        <circle class="hl" cx="16.4" cy="9.4" r="2.6"/>
        <circle class="hl2" cx="23.2" cy="16.6" r="1.2"/>
        <path class="star" d="M16.5 5.2 L17.7 8.5 L21 9.6 L17.7 10.7 L16.5 14 L15.3 10.7 L12 9.6 L15.3 8.5 Z"/>
      </g></g>
      <rect class="lid" x="-4" y="-30" width="48" height="30"/>
    </g>
    <path class="lash" d="M1 15 C 9 3 25 1 37 8 L 41 5"/>
    <path class="lower" d="M8 20 C 16 24 28 21 35 13"/>
  </g>
  <path class="happy" d="M5 17 C 12 6 28 6 35 17"/>
  <path class="spiral" d="M20 13 a1.5 1.5 0 1 1 3 0 a3 3 0 1 1 -6 0 a4.5 4.5 0 1 1 9 0 a6 6 0 1 1 -12 0"/>
  <path class="brow" d="M5 0 C 15 -4 27 -4 37 -1"/>
  <path class="blush" d="M12 29 l3 -3 M16 29 l3 -3 M20 29 l3 -3"/>`;
$("aeyes").insertAdjacentHTML("beforeend",
  `<g class="ae l" transform="translate(45 6) scale(-1 1)">${EYE}</g><g class="ae r" transform="translate(51 6)">${EYE}</g>`);
for (let i = 0; i < 9; i++) {   // particules de l'aura d'ombre
  const p = document.createElement("i");
  p.style.left = `${8 + Math.random() * 80}%`; p.style.animationDelay = `${(Math.random() * 1.6).toFixed(2)}s`;
  $("aura").appendChild(p);
}

window.setTheme = (name) => {
  theme = ["glass", "pio", "shadow"].includes(name) ? name : "glass"; LABEL = LABELS[theme] || LABELS.pio;
  document.body.classList.toggle("theme-shadow", theme === "shadow");
  document.body.classList.toggle("theme-glass", theme === "glass");
  $("cardTitle").textContent = theme === "shadow" ? "Quêtes du jour" : "Tâches";
  $("st").textContent = LABEL[state] || state;
  resizeNative();
};
// état de Jarvis → humeur de fond des yeux
const BASE = { boot: "boot", idle: "normal", listening: "listening", transcribing: "thinking",
               thinking: "thinking", working: "working", speaking: "speaking" };

let ws, closeTimer, flashTimer, state = "boot", lastW = 0, lastH = 0;
let flashMood = null, sleeping = false, near = false, dictating = false, lastMood = "";

/* ---------- humeur ---------- */
function render() {
  let mood = BASE[state] || "normal";
  if (mood === "normal" && sleeping) mood = "sleepy";
  else if (mood === "normal" && near) mood = "excited";
  if (flashMood) mood = flashMood;
  if (mood !== lastMood) {
    lastMood = mood; document.body.dataset.mood = mood;
    readTint(); glassKick();
    try { webkit.messageHandlers.mood.postMessage(mood); } catch (e) {}
  }
}
window.flash = (mood, ms = 1200) => {
  flashMood = mood; render(); clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { flashMood = null; render(); }, ms);
};

/* ---------- clignement naturel ---------- */
function blinkLoop() {
  setTimeout(() => {
    if (["normal", "excited", "speaking", "thinking"].includes(lastMood)) {
      document.querySelectorAll(".eye, .aeyes").forEach(e => e.classList.add("blink"));
      setTimeout(() => document.querySelectorAll(".eye, .aeyes").forEach(e => e.classList.remove("blink")), 120);
      if (Math.random() < .2) setTimeout(blinkLoop, 260);   // parfois un double clignement
    }
    blinkLoop();
  }, 2200 + Math.random() * 4200);
}

/* ---------- regard : la page reçoit la position du curseur ---------- */
window.gaze = (x, y) => {
  const r = $("face").getBoundingClientRect();
  const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1;
  const k = Math.min(7, d / 25) / d;
  $("eyes").style.transform = `translate(${(dx * k).toFixed(1)}px, ${(dy * k * .7).toFixed(1)}px)`;
  // yeux manga : seul l'iris bouge dans l'amande (l'œil gauche est en miroir)
  const ix = (dx * k * .65).toFixed(1), iy = (dy * k * .45).toFixed(1);
  document.querySelectorAll(".ae").forEach(g => {
    g.querySelector(".gz").style.transform = `translate(${g.classList.contains("l") ? -ix : ix}px, ${iy}px)`;
  });
  const wasNear = near; near = d < 110;
  if (near !== wasNear) render();
};
/* ---------- inactivité : il s'endort, puis sursaute ---------- */
window.idle = (sec) => {
  const s = sec > SLEEP_AFTER && state === "idle";
  if (sleeping && !s) { sleeping = false; flash("surprise", 700); return; }
  if (s !== sleeping) { sleeping = s; render(); }
};

/* ---------- touche maintenue ---------- */
window.ptt = (on, dictate) => {
  dictating = on && dictate;
  if (on) { open(); $("st").textContent = dictate ? "Dictée — je tape pour toi" : "Je t'écoute (relâche pour envoyer)"; }
};

/* ---------- taille et position ---------- */
window.setScale = (s) => { $("wrap").style.transform = `${document.body.classList.contains("center") ? "translateX(-50%) " : ""}scale(${s})`; resizeNative(); };
window.setDock = (d) => { document.body.classList.toggle("center", d === "center"); setScale(scale); };
let scale = +(Q.get("scale") || 1);

function resizeNative() {
  glassKick(800);
  const r = $("wrap").getBoundingClientRect();
  const w = Math.ceil(r.width + 8), h = Math.ceil(r.bottom + 6);
  if (w !== lastW || h !== lastH) {
    lastW = w; lastH = h;
    try { webkit.messageHandlers.size.postMessage({ w, h }); } catch (e) {}
  }
}
/* la fenêtre s'ajuste à la bulle : on garde la bulle collée au bord pendant l'animation */
new ResizeObserver(resizeNative).observe($("pill"));
new ResizeObserver(resizeNative).observe($("card"));

/* ---------- minuteur et tâches ---------- */
let planner = { todos: [], timer: null, show_todos: true }, skew = 0, selected = null;
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function timerValue() {   // secondes restantes (minuteur) ou écoulées (chrono)
  const t = planner.timer, now = Date.now() / 1000 + skew;
  if (!t) return null;
  if (t.kind === "timer") return t.paused ? t.remaining : Math.max(0, t.end_at - now);
  return t.paused ? t.elapsed : t.elapsed + now - t.start_at;
}
function fmtClock(s, countdown) {
  if (countdown && s < 60) return `${Math.floor(s)}<small>.${Math.floor((s % 1) * 10)}</small>`;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}
let lastClock = "";
function clockLoop() {
  const t = planner.timer, v = timerValue();
  // le minuteur prend la place des yeux quand Jarvis ne fait rien d'autre
  const show = t && !t.ringing && (state === "idle" || state === "boot");
  document.body.classList.toggle("timer", !!show);
  document.body.classList.toggle("ringing", !!(t && t.ringing));
  document.body.classList.toggle("paused", !!(t && t.paused));
  document.body.classList.toggle("hurry", !!(t && t.kind === "timer" && v < 10));
  if (show) {
    const html = fmtClock(v, t.kind === "timer");
    if (html !== lastClock) { lastClock = html; $("clock").innerHTML = html; }
  }
  setTimeout(clockLoop, planner.timer ? 100 : 1000);
}

function renderPlanner() {
  const todos = [...planner.todos].sort((a, b) => a.done - b.done);
  const open = todos.filter(t => !t.done).length;
  $("card").hidden = !(planner.show_todos && (todos.length || planner.timer));
  $("count").textContent = todos.length ? `${open} / ${todos.length}` : "";
  $("todos").innerHTML = todos.map(t => `
    <li data-id="${t.id}" class="${t.done ? "done" : ""} ${selected === t.id ? "sel" : ""}">
      <div class="row"><span class="box" data-act="toggle"></span><span class="txt">${esc(t.text)}</span></div>
      <div class="acts">
        <button data-act="t25">25 MIN</button><button data-act="chrono">CHRONO</button>
        <button data-act="done">${t.done ? "À FAIRE" : "FAIT"}</button><button class="del" data-act="remove">SUPPR</button>
      </div></li>`).join("");
  const t = planner.timer;
  $("tlabel").innerHTML = t ? `<span>${t.kind === "stopwatch" ? "Chrono" : t.is_break ? "Pause" : "Minuteur"}${t.label && !t.is_break ? " · " + esc(t.label) : ""}${t.paused ? " (en pause)" : ""}</span>
    <span>${t.ringing ? "" : `<button data-tact="toggle">${t.paused ? "REPRENDRE" : "PAUSE"}</button> `}<button data-tact="stop">STOP</button></span>` : "";
  $("lvl").textContent = `NIV. ${planner.level || 1}`;
  $("xpbar").style.width = `${100 * (planner.level_xp || 0) / (planner.level_need || 2)}%`;
  $("xptxt").textContent = `${planner.level_xp || 0}/${planner.level_need || 2} XP`;
  resizeNative();
}

/* ---------- notification de quête / level up ---------- */
let toastTimer;
function toast(e) {
  const el = $("toast");
  el.className = e.levelup ? "lvl" : "";
  el.innerHTML = e.levelup
    ? `<b>LEVEL UP !</b><span>Niveau ${e.level} atteint · ${esc(e.title)}</span>`
    : e.head ? `<b>${esc(e.head)}</b><span>${esc(e.title)}</span>`
    : `<b>QUÊTE ACCOMPLIE</b><span>${esc(e.title)} · +${e.xp} XP</span>`;
  void el.offsetWidth; el.classList.add("show"); resizeNative();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); resizeNative(); }, 3200);
}
$("todos").onclick = (e) => {
  const li = e.target.closest("li"); if (!li) return;
  const id = li.dataset.id, act = e.target.dataset.act, todo = planner.todos.find(t => t.id === id);
  if (act === "toggle") send({ type: "todo", action: "toggle", id });
  else if (act === "done") { send({ type: "todo", action: "toggle", id }); selected = null; }
  else if (act === "remove") { send({ type: "todo", action: "remove", id }); selected = null; }
  else if (act === "t25") { send({ type: "timer", action: "start", seconds: 1500, label: todo.text }); selected = null; }
  else if (act === "chrono") { send({ type: "timer", action: "stopwatch", label: todo.text }); selected = null; }
  else selected = selected === id ? null : id;
  renderPlanner();
};
window.toggleTodos = () => send({ type: "todo", action: planner.show_todos ? "hide" : "show" });
$("tlabel").onclick = (e) => { const a = e.target.dataset.tact; if (a) send({ type: "timer", action: a }); };
$("card").onclick = (e) => e.stopPropagation();

/* ---------- bulle ---------- */
function open() { clearTimeout(closeTimer); $("pill").classList.add("open"); resizeNative(); }
function closeSoon(ms) {
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => { $("pill").classList.remove("open"); $("me").textContent = ""; $("you").textContent = ""; resizeNative(); }, ms);
}
function setState(s) {
  state = s; $("st").textContent = LABEL[s] || s;
  if (s === "idle" || s === "boot") closeSoon(s === "idle" ? 4500 : 0); else open();
  render();
}

/* ---------- caresse : il rit ---------- */
let audio;
function chirp(notes) {
  try {
    audio = audio || new AudioContext();
    let t = audio.currentTime;
    notes.forEach(([f0, f1, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d + .02); t += d + .015;
    });
  } catch (e) {}
}
$("face").onclick = (e) => {
  e.stopPropagation();
  const t = planner.timer;
  if (t && t.ringing) return send({ type: "timer", action: "stop" });            // clic = couper l'alarme
  if (document.body.classList.contains("timer")) return send({ type: "timer", action: "toggle" });  // pause / reprise
  flash("laugh", 1500); chirp([[900, 1250, .05], [950, 1300, .05], [1000, 1380, .07]]);
};

/* ---------- liaison avec Jarvis ---------- */
let lastMsg = Date.now();
setInterval(() => {   // liaison muette (coupure non signalée) : on la refait
  window.__beat = Date.now();
  if (Date.now() - lastMsg > 7000 && ws) { try { ws.close(); } catch (_) {} ws = null; lastMsg = Date.now(); connect(); }
}, 1000);
function connect() {
  const mine = ws = new WebSocket(`ws://${location.host}/ws`);
  mine.onclose = () => { if (ws !== mine) return; setState("boot"); setTimeout(connect, 1500); };
  mine.onmessage = (e) => {
    lastMsg = window.__beat = Date.now();
    const m = JSON.parse(e.data);
    if (m.type === "stats") {   // le serveur écrit toutes les 2 s : sert de battement et recale l'état si on en a raté un
      if (m.state && m.state !== state) setState(m.state);
      if (m.speaking && state === "idle") flash("speaking", 1500);
      return;
    }
    if (m.type === "hello") setState(m.state);
    else if (m.type === "state") setState(m.state);
    else if (m.type === "level") { if (state === "listening") document.documentElement.style.setProperty("--lv", Math.min(1, m.v * 1.6)); }
    else if (m.type === "mood") flash(m.mood, m.mood === "error" ? 2500 : 1100);
    else if (m.type === "user") { $("you").textContent = m.text; $("me").textContent = ""; }
    else if (m.type === "delta") { $("me").textContent += m.text; open(); }
    else if (m.type === "planner") { planner = m; skew = m.now - Date.now() / 1000; renderPlanner(); }
    else if (m.type === "quest") toast(m);
    else if (m.type === "memory" && (m.added.length || m.removed.length)) {   // il vient d'apprendre (ou d'oublier)
      const first = m.added[0] ? m.added[0].text : "Oublié : " + m.removed[0];
      const more = m.added.length + m.removed.length > 1 ? ` (+${m.added.length + m.removed.length - 1})` : "";
      toast({ head: m.lesson ? "LEÇON APPRISE" : "MÉMOIRE MISE À JOUR",
              title: (first.length > 70 ? first.slice(0, 68) + "…" : first) + more });
    }
    else if (m.type === "dictated") {
      open(); $("st").textContent = m.pasted ? "Dicté" : "Copié — colle avec ⌘V"; $("you").textContent = m.text; closeSoon(3500);
    }
  };
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
$("mic").onclick = (e) => { e.stopPropagation(); send({ type: "listen" }); };
$("stop").onclick = (e) => { e.stopPropagation(); send({ type: "stop" }); };
$("pill").onclick = () => {
  if (planner.timer && planner.timer.ringing) return send({ type: "timer", action: "stop" });
  if (!$("pill").classList.contains("open")) { open(); closeSoon(4000); }
};

if (Q.get("dock") === "center") document.body.classList.add("center");
new ResizeObserver(resizeNative).observe($("toast"));
setTheme(theme); setScale(scale); render(); glassKick(2000); setInterval(() => glassKick(150), 2000); blinkLoop(); clockLoop(); connect();
</script>
