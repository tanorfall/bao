[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "fastapi>=0.162.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-webkit>=12.2.2",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
